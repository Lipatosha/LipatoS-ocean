name: Check original static asset paths
on:
  push:
    paths: [".github/workflows/check-assets.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public static asset URLs
        shell: bash
        run: |
          set -e
          for path in \
            ocean/assets/model/ship_aa/scene.bin \
            ocean/assets/model/viking_ship/scene.gltf \
            ocean/scripts/ocean.mjs \
            scenic3d/lib/three.module.js; do
            url="https://r2.foundryvtt.com/packages-public/$path"
            code="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 30 -r 0-4 "$url")"
            echo "$path: $code"
          done
