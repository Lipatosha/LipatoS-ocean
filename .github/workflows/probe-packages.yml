name: Probe original packages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-packages.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test public package access
        shell: bash
        run: |
          set -eu
          for mod in ocean scenic3d; do
            echo "::group::$mod manifest"
            url="https://r2.foundryvtt.com/packages-public/$mod/module.json"
            status="$(curl -L -sS --max-time 25 -o "/tmp/$mod.json" -w '%{http_code}' "$url")"
            echo "manifest HTTP: $status"
            if test "$status" = 200; then
              python - "$mod" <<'PY'
          import json,sys
          m=json.load(open('/tmp/'+sys.argv[1]+'.json'))
          print('version:',m.get('version'))
          print('protected:',m.get('protected'))
          print('download:',m.get('download'))
          PY
            fi
            for endpoint in "https://r2.foundryvtt.com/packages-public/$mod/$mod.zip" "https://r2.foundryvtt.com/packages-public/$mod/releases/latest/$mod.zip"; do
              status="$(curl -L -sS --max-time 35 -r 0-1 -o /dev/null -w '%{http_code}; bytes=%{size_download}; final=%{url_effective}' "$endpoint")"
              echo "$status"
            done
            echo "::endgroup::"
          done
