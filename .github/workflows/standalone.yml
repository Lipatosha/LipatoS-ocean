name: Build standalone LipatoS Ocean

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-ocean-release
  cancel-in-progress: false

jobs:
  standalone:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'source-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build-standalone.py

      - name: Download owned source packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source upstream
          mkdir -p .source upstream
          gh release download source-import --repo "$GITHUB_REPOSITORY" --dir .source
          OCEAN_ZIP="$(find .source -maxdepth 1 -type f -iname 'ocean*.zip' | head -n1)"
          SCENIC_ZIP="$(find .source -maxdepth 1 -type f -iname 'scenic3d*.zip' | head -n1)"
          test -n "$OCEAN_ZIP" && test -n "$SCENIC_ZIP"
          python - "$OCEAN_ZIP" "$SCENIC_ZIP" <<'PY'
          import pathlib, shutil, sys, zipfile
          dest = pathlib.Path("upstream")
          for archive, expected in [(sys.argv[1], "ocean"), (sys.argv[2], "scenic3d")]:
              with zipfile.ZipFile(archive) as z:
                  files=[i for i in z.infolist() if not i.is_dir()]
                  if not files or not all(i.filename.startswith(expected + "/") for i in files):
                      raise SystemExit(f"{archive}: expected root {expected}/")
                  for item in files:
                      rel=pathlib.PurePosixPath(*pathlib.PurePosixPath(item.filename).parts[1:])
                      if not rel.parts or ".." in rel.parts or rel.name=="signature.json":
                          continue
                      target=dest/expected/pathlib.Path(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as out:
                          shutil.copyfileobj(src,out,1024*1024)
          PY
          test -f upstream/ocean/scripts/ocean.mjs
          test -f upstream/ocean/assets/model/ship_aa/scene.bin
          test -f upstream/scenic3d/scripts/scenic3d.mjs
          test -f upstream/scenic3d/lib/three.module.js

      - name: Assemble standalone module
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-standalone.py
          find dist/ocean/scripts dist/ocean/vendor/scenic3d/scripts \
            -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("dist/ocean/module.json").read_text())
          assert m["id"] == "ocean" and m["version"] == "2.1.0"
          assert not m.get("relationships",{}).get("requires")
          assert len(m["esmodules"]) == 3
          assert len(json.loads(pathlib.Path("dist/ocean/lang/ru.json").read_text())) == 686
          print("PASS: independent module, bundled 3D engine, 686 translated keys")
          PY

      - name: Build installable module
        shell: bash
        run: |
          set -euo pipefail
          cd dist/ocean
          zip -qr ../../lipatos-ocean.zip .
          test "$(stat -c%s ../../lipatos-ocean.zip)" -gt 300000000

      - name: Publish standalone v2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            git push --delete origin "$TAG" || true
          fi
          cp dist/ocean/module.json module.json
          cp docs/README-STANDALONE.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Switch to standalone Ocean 2.1.0"
            git push origin HEAD:main
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            lipatos-ocean.zip dist/ocean/module.json#module.json \
            --target "$TARGET" \
            --title "LipatoS — Ocean v2.1.0" \
            --notes "Самостоятельный русскоязычный Ocean со встроенным Scenic3D. Отдельные Ocean и Scenic3D не требуются. Сохранён ID ocean для совместимости с существующими мирами."
