name: Build standalone LipatoS Ocean

on:
  push:
    branches: [main]
    paths:
      - "upstream/**"
      - "tools/build-standalone.py"
      - "lang/scenic-ru.json"
      - ".github/workflows/standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-ocean-release
  cancel-in-progress: false

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate build tooling
        shell: bash
        run: |
          python -m py_compile tools/build-standalone.py tools/import-owned-source.py

      - name: Check original source import
        id: source
        shell: bash
        run: |
          if test -f upstream/ocean/scripts/ocean.mjs &&
             test -f upstream/ocean/assets/model/ship_aa/scene.bin &&
             test -f upstream/scenic3d/scripts/scenic3d.mjs &&
             test -f upstream/scenic3d/lib/three.module.js; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Исходные файлы ещё не загружены поштучно в upstream/. Публикация самостоятельного релиза запрещена."
          fi

      - name: Assemble standalone module
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-standalone.py
          find dist/ocean/scripts dist/ocean/vendor/scenic3d/scripts \
            -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("dist/ocean/module.json").read_text())
          assert m["id"] == "ocean" and m["version"] == "2.0.0"
          assert not m.get("relationships",{}).get("requires")
          assert len(m["esmodules"]) == 3
          assert len(json.loads(pathlib.Path("dist/ocean/lang/ru.json").read_text())) == 686
          print("PASS: independent module, bundled 3D engine, 686 translated keys")
          PY

      - name: Build installable module
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist/ocean
          zip -qr ../../lipatos-ocean.zip .
          test "$(stat -c%s ../../lipatos-ocean.zip)" -gt 300000000

      - name: Update repository manifest and publish release
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not overwriting assets."
            exit 0
          fi
          cp dist/ocean/module.json module.json
          cp docs/README-STANDALONE.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Switch to standalone Ocean 2.0.0"
            git push origin HEAD:main
          fi
          TARGET="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            lipatos-ocean.zip dist/ocean/module.json#module.json \
            --target "$TARGET" \
            --title "LipatoS — Ocean v2.0.0" \
            --notes "Самостоятельный русскоязычный Ocean со встроенным Scenic3D. Не требует установки ocean или scenic3d отдельно. Сохранён ID ocean для совместимости с мирами; прежний модуль lipatos-ocean 1.0.x необходимо отключить."
